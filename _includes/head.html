<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <meta name="theme-color" content="#8b1538">
  <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}?v=20260730-profile-cards">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
  <link rel="icon" type="image/png" href="{{ '/images/siggers-lab-favicon.png' | relative_url }}">
  <link rel="shortcut icon" href="{{ '/images/siggers-lab-favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/images/siggers-lab-favicon.png' | relative_url }}">
  {% if jekyll.environment == 'production' %}
  {% include analytics.html %}
  {% endif %}
</head>
